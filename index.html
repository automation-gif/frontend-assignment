<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All work · Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Workspace</div>
    <nav>
      <p class="nav-label">Production</p>
      <a class="nav-link is-active" href="#">All work</a>
      <a class="nav-link" href="#">Shoots</a>
      <a class="nav-link" href="#">Post</a>
      <a class="nav-link" href="#">Deliveries</a>

      <p class="nav-label">Clients</p>

      <p class="nav-label">Internal</p>
      <a class="nav-link" href="#">Admin</a>
      <a class="nav-link" href="#">Hiring</a>
    </nav>

  <main class="main">
    <header class="page-head">
      <p class="eyebrow">Production</p>
      <h1>All work</h1>
      <p class="subtitle" id="subtitle"></p>

    <table class="work-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Client</th>
          <th>Brand</th>

          <th>Status</th>

      <tbody id="rows"></tbody>
    </table>

  <script type="module" src="app.js"></script>
